services:
  studio:
    image: creative-studio-pro:production
    pull_policy: never
    container_name: creative-studio-pro
    restart: unless-stopped
    env_file: private.env
    ports:
      - "127.0.0.1:18110:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/projects').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

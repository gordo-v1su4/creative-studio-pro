name: CSP CI
# Paused 2026-10-23 at the operator's request: manual runs only (Actions → CSP CI → Run workflow).
# To turn it back on, restore the `push:` and `pull_request:` triggers.
on:
  workflow_dispatch:
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
